name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Wake Instabox
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
        run: chmod +x scripts/instabox-wake.sh && ./scripts/instabox-wake.sh
  build:
    needs: wake
    runs-on: [self-hosted, instabox, instabox-usa]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # `tsc -b` runs with noUnusedLocals and noUnusedParameters, so this is the
      # only gate that catches a dead import or an unused binding. dist/ is
      # gitignored, so nothing else would notice the build breaking.
      - name: Build
        run: npm run build

      # Building only proves it compiles. These cover the option clamps that
      # decide what reaches a shader uniform, and the disposer the page calls on
      # unmount — neither of which a build can execute.
      - name: Test
        run: npm test
