name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # `tsc -b` runs with noUnusedLocals and noUnusedParameters, so this is the
      # only gate that catches a dead import or an unused binding. dist/ is
      # gitignored, so nothing else would notice the build breaking.
      - name: Build
        run: npm run build
