<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050408" />
    <meta name="color-scheme" content="dark" />
    <title>purpledr.ink</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/ChakraPetch-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts.css" />
    <style>
      /* Painted before the module bundle lands, so the first frame is the
         finished composition instead of a flash of bare background. */
      #root {
        position: relative;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow: hidden;
        background: #050408;
      }
      .hero {
        margin: 0;
        font-family: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(2.5rem, 11vw, 6.8rem);
        letter-spacing: 0.06em;
        line-height: 1;
        color: #c4b5fd;
        text-align: center;
        text-shadow: 0 0 24px rgba(139, 92, 246, 0.45);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
